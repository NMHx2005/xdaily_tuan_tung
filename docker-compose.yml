services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: xdaily
      POSTGRES_PASSWORD: xdaily_secret
      POSTGRES_DB: xdaily
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
